<html lang="fr">

<title>Éditeur VOCAB_RAW — Corsu</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #f5f5f5; color: #222; }

  header {
    background: #1a1a2e;
    color: white;
    padding: 1rem 1.5rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  header h1 { font-size: 1.1rem; font-weight: 700; flex: 0 0 auto; }
  .header-stats { font-size: 0.8rem; color: #aaa; flex: 0 0 auto; }

  .toolbar {
    background: white;
    padding: 0.75rem 1.5rem;
    display: flex;
    gap: 0.75rem;
    align-items: center;
    flex-wrap: wrap;
    border-bottom: 1px solid #e0e0e0;
    position: sticky;
    top: 57px;
    z-index: 99;
    box-shadow: 0 1px 4px rgba(0,0,0,0.05);
  }
  .toolbar input[type=text] {
    padding: 0.45rem 0.75rem;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 0.9rem;
    width: 220px;
  }
  .toolbar input[type=text]:focus { outline: none; border-color: #6c63ff; }
  .filter-btn {
    padding: 0.4rem 0.9rem;
    border: 1px solid #ccc;
    border-radius: 20px;
    background: white;
    cursor: pointer;
    font-size: 0.82rem;
    transition: all 0.15s;
  }
  .filter-btn.active { background: #1a1a2e; color: white; border-color: #1a1a2e; }
  .filter-btn:hover:not(.active) { background: #f0f0f0; }

  .show-modified-btn {
    padding: 0.4rem 0.9rem;
    border: 1px solid #f0a000;
    border-radius: 20px;
    background: white;
    cursor: pointer;
    font-size: 0.82rem;
    color: #c07000;
    transition: all 0.15s;
    margin-left: auto;
  }
  .show-modified-btn.active { background: #fff3e0; }

  .export-btn {
    padding: 0.45rem 1.1rem;
    background: #6c63ff;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.88rem;
    font-weight: 600;
    transition: opacity 0.15s;
  }
  .export-btn:hover { opacity: 0.85; }
  .export-btn:disabled { opacity: 0.4; cursor: default; }

  .share-btn {
    padding: 0.45rem 1.1rem;
    background: #2e7d32;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.88rem;
    font-weight: 600;
    transition: opacity 0.15s;
  }
  .share-btn:hover { opacity: 0.85; }

  .count-label { font-size: 0.8rem; color: #888; }

  table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    font-size: 0.9rem;
  }
  thead th {
    background: #1a1a2e;
    color: white;
    padding: 0.6rem 1rem;
    text-align: left;
    font-weight: 600;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  tbody tr { border-bottom: 1px solid #f0f0f0; }
  tbody tr:hover { background: #fafafa; }
  tbody tr.modified { background: #fffbea; }
  tbody tr.modified:hover { background: #fff5d0; }
  td { padding: 0.55rem 1rem; vertical-align: middle; }

  .td-id { color: #aaa; font-size: 0.75rem; width: 70px; }
  .td-fr { font-weight: 500; width: 24%; }
  .td-co { width: 27%; }
  .td-cis { width: 27%; }
  .td-cis .co-edit { background: #f6faf7; }
  .th-sub2 { font-size: 0.6rem; font-weight: 400; color: #2e8b57; text-transform: uppercase; letter-spacing: 0.05em; }
  .td-cat { width: 10%; }
  .td-actions { width: 100px; text-align: center; white-space: nowrap; }

  .co-edit {
    width: 100%;
    padding: 0.3rem 0.5rem;
    border: 1px solid transparent;
    border-radius: 6px;
    font-size: 0.9rem;
    background: transparent;
    transition: all 0.15s;
    font-family: inherit;
  }
  .co-edit:hover { border-color: #ddd; background: white; }
  .co-edit:focus { outline: none; border-color: #6c63ff; background: white; box-shadow: 0 0 0 3px rgba(108,99,255,0.1); }
  .modified .co-edit { color: #6c63ff; font-weight: 600; }

  .cat-badge {
    display: inline-block;
    padding: 0.15rem 0.55rem;
    border-radius: 20px;
    font-size: 0.72rem;
    font-weight: 600;
    background: #eef;
    color: #446;
  }

  .cat-select {
    width: 100%;
    padding: 0.3rem 0.4rem;
    border: 1px solid transparent;
    border-radius: 6px;
    font-size: 0.82rem;
    background: transparent;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }
  .cat-select:hover { border-color: #ddd; background: white; }
  .cat-select:focus { outline: none; border-color: #6c63ff; background: white; }
  .modified .cat-select { color: #6c63ff; font-weight: 600; }

  .user-badge {
    display: inline-block;
    padding: 0.1rem 0.4rem;
    border-radius: 10px;
    font-size: 0.68rem;
    font-weight: 700;
    background: #e8f5e9;
    color: #388e3c;
    margin-top: 3px;
    display: block;
  }
  .user-row { background: #f9fff9; }
  .user-row:hover { background: #f0faf0 !important; }
  @keyframes savedFlash { 0%,100% { background: #f9fff9; } 50% { background: #c8e6c9; } }
  .user-saved { animation: savedFlash 0.6s ease; }

  .reset-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: #ccc;
    font-size: 1rem;
    padding: 0.2rem;
    border-radius: 4px;
    transition: color 0.15s;
    display: none;
  }
  .modified .reset-btn { display: inline-block; color: #f0a000; }
  .reset-btn:hover { color: #e05000; }

  .delete-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: #ddd;
    font-size: 1rem;
    padding: 0.2rem;
    border-radius: 4px;
    transition: color 0.15s;
  }
  .delete-btn:hover { color: #e03030; }

  .modified-dot {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #6c63ff;
    margin-right: 6px;
    vertical-align: middle;
    opacity: 0;
  }
  .modified .modified-dot { opacity: 1; }

  /* Export modal */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 200;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: white;
    border-radius: 16px;
    padding: 1.5rem;
    max-width: 600px;
    width: 90%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .modal h2 { font-size: 1.1rem; margin-bottom: 0.5rem; }
  .modal p { font-size: 0.85rem; color: #666; margin-bottom: 1rem; }
  .modal textarea {
    width: 100%;
    height: 200px;
    font-family: monospace;
    font-size: 0.8rem;
    padding: 0.75rem;
    border: 1px solid #ddd;
    border-radius: 8px;
    resize: vertical;
  }
  .modal-actions { display: flex; gap: 0.75rem; margin-top: 1rem; justify-content: flex-end; }
  .btn-copy {
    padding: 0.5rem 1.2rem;
    background: #6c63ff;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 600;
  }
  .btn-copy:hover { opacity: 0.85; }
  .btn-close-modal {
    padding: 0.5rem 1.2rem;
    background: white;
    color: #444;
    border: 1px solid #ddd;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.9rem;
  }

  .loading { text-align: center; padding: 3rem; color: #888; font-size: 1rem; }
  .error { text-align: center; padding: 3rem; color: #c00; }

  .td-check { width: 44px; text-align: center; }
  .verify-cb {
    width: 16px; height: 16px;
    cursor: pointer;
    accent-color: #22a84b;
  }
  tbody tr.verified { background: #f0faf3; }
  tbody tr.verified:hover { background: #e4f5e9 !important; }
  tbody tr.verified.modified { background: #f0faf3; }
  .show-verified-btn {
    padding: 0.4rem 0.9rem;
    border: 1px solid #22a84b;
    border-radius: 20px;
    background: white;
    cursor: pointer;
    font-size: 0.82rem;
    color: #1a7a38;
    transition: all 0.15s;
  }
  .show-verified-btn.active { background: #e4f5e9; }

  /* ═══════ MOBILE : tableau → cartes ═══════ */
  @media (max-width: 720px) {
    header { padding: calc(0.6rem + env(safe-area-inset-top)) 0.9rem 0.6rem; gap: 0.5rem; }
    header h1 { font-size: 1rem; }
    .header-stats { font-size: 0.72rem; }

    .toolbar { position: static; padding: 0.6rem 0.7rem; gap: 0.45rem; }
    .toolbar input[type=text] { width: 100%; font-size: 16px; padding: 0.6rem 0.75rem; }
    .filter-btn, .show-modified-btn, .show-verified-btn { font-size: 0.8rem; padding: 0.45rem 0.75rem; }
    .show-modified-btn { margin-left: 0; }
    .count-label { width: 100%; order: 10; }
    .export-btn, .share-btn { flex: 1 1 45%; font-size: 0.85rem; padding: 0.65rem 0.5rem; text-align: center; }

    /* Chaque ligne devient une carte */
    table, tbody, tr, td { display: block; width: auto; }
    .td-fr, .td-co, .td-cis, .td-cat, .td-actions, .td-id, .td-check { width: auto; }
    thead { display: none; }
    table { background: transparent; font-size: 1rem; }
    tbody tr {
      background: white; border: 1px solid #e2e2e2; border-radius: 12px;
      margin: 0.7rem; padding: 1.6rem 0.9rem 0.7rem;
      box-shadow: 0 1px 5px rgba(0,0,0,0.06); position: relative;
    }
    tbody tr.modified { border-left: 4px solid #6c63ff; background: #fffdf5; }
    tbody tr.verified { background: #f5fbf7; }
    tbody tr:hover, tbody tr.modified:hover, tbody tr.verified:hover { background: inherit !important; }
    td { padding: 0.3rem 0; vertical-align: top; }

    /* Libellés au-dessus de chaque champ */
    .td-fr::before, .td-co::before, .td-cis::before, .td-cat::before {
      display: block; font-size: 0.66rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.04em; color: #999; margin-bottom: 0.28rem;
    }
    .td-fr::before  { content: 'Français'; }
    .td-co::before  { content: 'Pumunticu · sud'; color: #b06a00; }
    .td-cis::before { content: 'Cismunticu · nord'; color: #2e8b57; }
    .td-cat::before { content: 'Catégorie'; }

    /* Champs : grands, tactiles, 16px (pas de zoom iOS) */
    .co-edit, .cat-select {
      width: 100%; border: 1px solid #cfcfcf; background: white; font-size: 16px;
      padding: 0.6rem 0.7rem; border-radius: 8px;
    }
    .td-cis .co-edit { background: #f3faf5; }
    .modified .co-edit, .modified .cat-select { font-weight: 600; }
    .modified-dot { display: none; }

    /* ID en petit en haut à gauche */
    .td-id { position: absolute; top: 0.5rem; left: 0.9rem; font-size: 0.7rem; color: #999; padding: 0; width: auto; }
    .user-badge { display: inline-block; margin: 0 0 0 0.35rem; }

    /* Case « vérifié » en haut à droite */
    .td-check { position: absolute; top: 0.4rem; right: 0.7rem; width: auto; display: flex; align-items: center; gap: 0.3rem; padding: 0; }
    .td-check::after { content: 'vérifié'; font-size: 0.66rem; color: #999; }
    .verify-cb { width: 20px; height: 20px; }

    /* Actions : boutons plus gros, alignés à droite */
    .td-actions { width: auto; text-align: right; padding-top: 0.4rem; white-space: nowrap; }
    .reset-btn, .delete-btn { font-size: 1.4rem; padding: 0.35rem 0.55rem; }
    .modified .reset-btn { display: inline-block; }
  }
</style>
</head>

<header>
  <h1>✏️ Éditeur Vocabulaire Corse</h1>
  <span class="header-stats" id="header-stats">Chargement…</span>
</header>

<div class="toolbar">
  <input type="text" id="search" placeholder="🔍 Rechercher (fr, pumunticu ou cismunticu)…" oninput="applyFilters()">
  <button class="filter-btn active" data-cat="all" onclick="setFilter(this,'all')">Tout</button>
  <button class="filter-btn" data-cat="mot"   onclick="setFilter(this,'mot')">Mots</button>
  <button class="filter-btn" data-cat="expr"  onclick="setFilter(this,'expr')">Expressions</button>
  <button class="filter-btn" data-cat="phr"   onclick="setFilter(this,'phr')">Phrases</button>
  <button class="filter-btn" data-cat="nb"    onclick="setFilter(this,'nb')">Cahier</button>
  <button class="filter-btn" data-cat="pr"    onclick="setFilter(this,'pr')">Proverbes</button>
  <button class="show-modified-btn" id="show-modified-btn" onclick="toggleModifiedOnly()">⬥ Modifiés seulement</button>
  <button class="show-verified-btn" id="show-verified-btn" onclick="toggleVerifiedOnly()">✓ Non vérifiés</button>
  <span class="count-label" id="count-label"></span>
  <button class="export-btn" id="export-btn" onclick="openExport()" disabled>📋 Exporter les modifications (0)</button>
  <button class="share-btn" onclick="exportSnapshot()">📤 Partager mes modifications</button>
</div>

<div id="table-container">
  <div class="loading" id="loading">Initialisation…</div>
</div>

<!-- Export modal -->
<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h2>📋 Modifications à coller dans le chat</h2>
    <p>Copie ce texte et colle-le dans le chat avec Claude. Les modifications seront appliquées automatiquement dans <code>corsu.html</code>.</p>
    <textarea id="export-text" readonly></textarea>
    <div class="modal-actions">
      <button class="btn-close-modal" onclick="closeModal()">Fermer</button>
      <button class="btn-copy" onclick="copyExport()">📋 Copier</button>
    </div>
  </div>
</div>

<script>
let vocab = [];         // {id, fr, co, cat}
let originals = {};     // id -> original co
let modified = {};      // id -> new co
let verified = {};      // id -> true
let currentCat = 'all';
let showModifiedOnly = false;
let showUnverifiedOnly = false;

const VERIFIED_KEY = 'corsu_verified_v1';
function loadVerified() {
  try { return JSON.parse(localStorage.getItem(VERIFIED_KEY) || '{}'); } catch(e) { return {}; }
}
function saveVerified() {
  try { localStorage.setItem(VERIFIED_KEY, JSON.stringify(verified)); } catch(e) {}
}

const MODIFIED_KEY = 'corsu_modified_v1';
function loadModified() {
  try { return JSON.parse(localStorage.getItem(MODIFIED_KEY) || '{}'); } catch(e) { return {}; }
}
function saveModified() {
  try { localStorage.setItem(MODIFIED_KEY, JSON.stringify(modified)); } catch(e) {}
}

  { id:'pr16', fr:'Ne vous signez pas avant d\'avoir vu le diable.', pum:'Ùn vi fate croce nanzu di vede u diavule.', cat:'proverbe' },
  { id:'pr17', fr:'À un âne de trente ans, il ne rentrera jamais plus de jugeote.', pum:'Asinu di trenta mai più ch\'ellu ci n\'entri.', cat:'proverbe' },
  { id:'pr18', fr:'Qui se fait agneau, le loup le mange.', pum:'Chì agneddu si face u lupu u si manghja.', cat:'proverbe' },
  { id:'pr19', fr:'Les loups n\'accouchent pas d\'agneaux.', pum:'I lupi ùn parturiscinu agnelli.', cat:'proverbe' },
  { id:'pr20', fr:'Appauvris-moi (dit l\'arbre) et je t\'enrichirai.', pum:'Impuveriscimi chì t\'arricchisceraghju.', cat:'proverbe' },
  { id:'pr21', fr:'Toute aide est un bon réconfort.', pum:'Ogni aiutu hè bon cunfortu.', cat:'proverbe' },
  { id:'pr22', fr:'Va droit, Corse, et Dieu t\'aidera.', pum:'Va drittu, o Corsu, chì Diu t\'aiuterà.', cat:'proverbe' },
  { id:'pr23', fr:'Qui ne s\'aide pas se noie.', pum:'À chì ùn s\'aiuta... s\'annega.', cat:'proverbe' },
  { id:'pr24', fr:'En allant à son pas on va loin.', pum:'Cù u so passu si và luntanu.', cat:'proverbe' },
  { id:'pr25', fr:'Qui va doucement va sainement, qui va sainement va loin', pum:'Chì và pianu và sanu, chì va sanu và luntanu', cat:'proverbe' },
  { id:'pr26', fr:'L\'âme à Dieu, le corps à la terre, et les biens à qui ils reviennent.', pum:'L\'anima à Diu, u corpu à a terra è a robba à chì veni.', cat:'proverbe' },
  { id:'pr27', fr:'Qui boit de l\'amer ne crache pas du doux.', pum:'Chì beie amaru ùn stupà dolce.', cat:'proverbe' },
  { id:'pr28', fr:'Profite de ton ami avec ses défauts.', pum:'Godi l\'amicu toiu cù u viziu soiu.', cat:'proverbe' },
  { id:'pr29', fr:'Votre ami, ne le mettez jamais à l\'épreuve.', pum:'U vostru amicu, ùn u mettite micca a prova.', cat:'proverbe' },
  { id:'pr30', fr:'L\'amitié et les tripes ne sont bonnes que chaudes.', pum:'Amicizia è trippe ùn sò bone chè calde.', cat:'proverbe' },
  { id:'pr31', fr:'Amitié reprise et choux réchauffés ne furent jamais bons.', pum:'Amicizia ritirata è carbusgi riscaldati ùn funu mai boni.', cat:'proverbe' },
  { id:'pr32', fr:'Avec de vieux ennemis ne fais pas une amitié nouvelle.', pum:'Cun nimici vechji ùn fà amicizia nova.', cat:'proverbe' },
  { id:'pr33', fr:'Avec une figue tu te fais un ami ; avec rien tu te fais un ennemi.', pum:'Cù un ficu ti faci un amicu ; cù nulla ti faci un nemicu.', cat:'proverbe' },
  { id:'pr34', fr:'Il vaut mieux un bon ami que cent parents.', pum:'Hè meddu un bon amicu chè centu parenti.', cat:'proverbe' },
  { id:'pr35', fr:'Avec ton ami le plus cher, vis avec le plus de clarté.', pum:'Cù u to più caru vivi più chjaru.', cat:'proverbe' },
  { id:'pr36', fr:'Aime qui t\'aime et réponds à qui t\'appelle.', pum:'Ama à chì t\'ama è rispondi à chì ti chjama.', cat:'proverbe' },
  { id:'pr37', fr:'Qui se prend d\'amour se lâche de rage.', pum:'Chì si piglia d\'amore si lenta di rabbia.', cat:'proverbe' },
  { id:'pr38', fr:'Les baisers ne laissent pas de trace sur le visage mais ils en laissent sur le cœur.', pum:'I basgi ùn lascianu stampa sopr\'à a faccia ma a lascianu annant\'à u core.', cat:'proverbe' },
  { id:'pr39', fr:'Il vaut mieux se faire aimer que craindre.', pum:'Hè megliu à fassi amà chè teme.', cat:'proverbe' },
  { id:'pr40', fr:'L\'amour finit avec le mariage.', pum:'L\'amore finisce cù u matrimoniu.', cat:'proverbe' },
  { id:'pr41', fr:'Qui perd au jeu est heureux en amour.', pum:'À chì perde à u ghjocu hè furtunatu in amore.', cat:'proverbe' },
  { id:'pr42', fr:'L\'amour est aveugle.', pum:'L\'amore hè cecu.', cat:'proverbe' },
  { id:'pr43', fr:'La jeunesse vit d\'amour et d\'eau fraîche.', pum:'A giuventù campa d\'amore è d\'acqua fresca.', cat:'proverbe' },
  { id:'pr44', fr:'On ne peut aimer qu\'une seule fois.', pum:'Ùn si pò amà chè una volta.', cat:'proverbe' },
  { id:'pr45', fr:'Loin des yeux, loin du cœur.', pum:'Luntanu da l\'ochji, luntanu da u core.', cat:'proverbe' },
  { id:'pr46', fr:'Il vaut mieux être la tête de l\'anchois que la queue du serpent.', pum:'Hè meddu à esse capu d\'anchjuva chè coda di sarpi.', cat:'proverbe' },
  { id:'pr47', fr:'Ce qui n\'arrive pas en un an arrive en une heure.', pum:'Ciò ch\'ùn accade in un annu accade in una ora.', cat:'proverbe' },
  { id:'pr48', fr:'N\'est pas or tout ce qui luit.', pum:'Ùn hè oru tuttu quellu chì luce.', cat:'proverbe' },
  { id:'pr49', fr:'La belle cage ne nourrit pas l\'oiseau.', pum:'A bella cabbia ùn nutrisce l\'acellu.', cat:'proverbe' },
  { id:'pr50', fr:'Le meilleur des mets, c\'est l\'appétit.', pum:'A migliò pietanza di tavula hè l\'appitittu.', cat:'proverbe' },
  { id:'pr51', fr:'Quand on n\'a pas d\'argent, on pue plus qu\'un chien mort.', pum:'Quandu ùn si hà soldi si puzza più chè un cane mortu.', cat:'proverbe' },
  { id:'pr52', fr:'Plaie d\'argent n\'est pas mortelle.', pum:'Perdita di dinari ùn hè morte d\'omu.', cat:'proverbe' },
  { id:'pr53', fr:'Ce qui vient en musique s\'en va en chantant.', pum:'Ciò chì vene sunendu si ne và cantendu.', cat:'proverbe' },
  { id:'pr54', fr:'Sans argent on ne chante pas de messe.', pum:'Senza soldi ùn si canta messa.', cat:'proverbe' },
  { id:'pr55', fr:'L\'argent ne se mange pas, mais il fait manger.', pum:'I soldi ùn si magnanu ma facenu magnà.', cat:'proverbe' },
  { id:'pr56', fr:'Il vaut mieux un mauvais arrangement qu\'une belle décision de justice.', pum:'Hè megliu un gattivu acconciu chè un bellu ghjudiziu.', cat:'proverbe' },
  { id:'pr57', fr:'Qui arrive le premier moud son blé au moulin le premier.', pum:'Chì prima ghjunghje prima macina.', cat:'proverbe' },
  { id:'pr58', fr:'Le temps vient à qui sait l\'attendre.', pum:'Tempu vene à chì l\'aspetta.', cat:'proverbe' },
  { id:'pr59', fr:'Celui qui s\'occupe des affaires d\'autrui, de trois ennuis deux seront pour lui.', pum:'À chì s\'occupa di i fatti altrui, di trè malanni li ne tocca dui.', cat:'proverbe' },
  { id:'pr60', fr:'Le rôti qui ne te concerne pas, laisse-le brûler.', pum:'Arrostu chì ùn ti tocca, lascialu brusgià.', cat:'proverbe' },
  { id:'pr61', fr:'Des autres on ne voit que les défauts.', pum:'Ùn si vedenu chè i difetti di l\'altri.', cat:'proverbe' },
  { id:'pr62', fr:'On ne peut pas savoir de quoi sera fait demain.', pum:'Ùn si pò sapè di ciò ch\'ellu sarà fattu dumane.', cat:'proverbe' },
  { id:'pr63', fr:'On ne peut jamais dire : fontaine, je ne boirai pas de ton eau.', pum:'Ùn si pò dì : funtana ùn bieraghju di a to acqua.', cat:'proverbe' },
  { id:'pr64', fr:'Ne change jamais un borgne pour un aveugle.', pum:'Ùn scambià mai un guerciu pè un cecu.', cat:'proverbe' },
  { id:'pr65', fr:'Il vaut mieux en avoir au point de donner que d\'avoir à en demander.', pum:'Hè megliu ad avenne per dà chè ad avè da chere.', cat:'proverbe' },
  { id:'pr66', fr:'Le beau est pour tous, le laid pour qui aime.', pum:'U bellu hè per tutti, u goffu per chì piace.', cat:'proverbe' },
  { id:'pr67', fr:'N\'est pas beau celui qui est tenu pour beau, mais celui qui plaît.', pum:'Ùn hè bellu quel chì hè bellu ma hè bellu quel chì piace.', cat:'proverbe' },
  { id:'pr68', fr:'La beauté ne remplit pas la maison.', pum:'A beddezza ùn empie a casa.', cat:'proverbe' },
  { id:'pr69', fr:'Qui a soif boit dans n\'importe quelle flaque.', pum:'Chì hà sete beie ad ogni pozzu.', cat:'proverbe' },
  { id:'pr70', fr:'N\'oublie jamais ceux qui t\'ont fait du bien.', pum:'Ùn ti sminticà mai di quelli chì t\'anu fattu u bè.', cat:'proverbe' },
  { id:'pr71', fr:'Qui te veut du bien te fait pleurer, qui te veut du mal te fait rire.', pum:'Chì ti vole bè ti face pienghje, chì ti vole male ti face ride.', cat:'proverbe' },
  { id:'pr72', fr:'Le bien est l\'ennemi du mieux.', pum:'U bè hè nemicu di u meddu.', cat:'proverbe' },
  { id:'pr73', fr:'Après la tempête vient la bonace.', pum:'Dopu a timpesta vene a bunaccia.', cat:'proverbe' },
  { id:'pr74', fr:'Après carnaval vient le carême.', pum:'Dopu carnavale, vene a quaresima.', cat:'proverbe' },
  { id:'pr75', fr:'Celui qui à vingt ans n\'est rien et à trente ne sait rien, n\'a jamais été et ne sera jamais.', pum:'Chì à vinti ùn hè è à trenta ùn sà, mai hè statu è mai serà.', cat:'proverbe' },
  { id:'pr76', fr:'Qui à dix ans ne veut et à vingt ans ne sait, flanque-lui un coup de pied et laisse-le aller.', pum:'À chì à dece ùn vole è à vinti ùn sà, prendi un calciu è po lagalu andà.', cat:'proverbe' },
  { id:'pr77', fr:'Ne donne pas de saucisson à qui a déjà soif.', pum:'Ùn dà salamu à chì hà digià sete.', cat:'proverbe' },
  { id:'pr78', fr:'Accords clairs, amis chers.', pum:'Patti chjari, amici cari.', cat:'proverbe' },
  { id:'pr79', fr:'Qui ne sait pas faire ses propres affaires sait encore moins faire celles des autres.', pum:'Chì ùn sà fà i fatti soi, peghju sà fà quelli di l\'altri.', cat:'proverbe' },
  { id:'pr80', fr:'L\'amour est comme la fumée : il aveugle les yeux et ne voit plus la lumière.', pum:'L\'amore hè cum\'è u fume, acceca l\'ochji è ùn vede lume.', cat:'proverbe' },

  // ── Pruverbii – Parte 2 ──────────────────────────────────────────────────
  { id:'pr81',  fr:'Qui méprise le danger souvent s\'arrête.',                                          pum:'Chì disprezza u periculu spessu si ferma.',                                               cat:'proverbe' },
  { id:'pr82',  fr:'Qui sème des épines n\'aille pas pieds nus.',                                       pum:'À chì sumena triuli ùn vaghi scalzu.',                                                   cat:'proverbe' },
  { id:'pr83',  fr:'Qui n\'a pas les dents solides qu\'il ait les ongles solides.',                     pum:'Chì ùn hà forti i denti abbia forte l\'unghje.',                                         cat:'proverbe' },
  { id:'pr84',  fr:'Pense aujourd\'hui à ce dont tu auras besoin demain.',                              pum:'Pensa oghje à ciò chì t\'abbisugnarà dumane.',                                           cat:'proverbe' },
  { id:'pr85',  fr:'Aujourd\'hui est aujourd\'hui, demain est demain.',                                 pum:'Oghje hè oghje è dumane hè dumane.',                                                     cat:'proverbe' },
  { id:'pr86',  fr:'Demander est licite, donner est courtoisie.',                                       pum:'U dumandà hè lecitu, u dà hè curtesia.',                                                 cat:'proverbe' },
  { id:'pr87',  fr:'En demandant son chemin, on arrive à Rome.',                                        pum:'Cù e dumande si và à Roma.',                                                             cat:'proverbe' },
  { id:'pr88',  fr:'Qui trop veut n\'obtient rien.',                                                    pum:'Chì troppu vole nunda ottene.',                                                          cat:'proverbe' },
  { id:'pr89',  fr:'À trop tirer, la corde casse.',                                                     pum:'Cù u troppu tirà a corda strappa.',                                                      cat:'proverbe' },
  { id:'pr90',  fr:'Qui veut tout perd tout.',                                                          pum:'Chì u troppu vole u tuttu perde.',                                                       cat:'proverbe' },
  { id:'pr91',  fr:'Il est facile de dépenser l\'argent, mais pour le gagner on sue.',                  pum:'Hè faciule à spende soldi, ma pà guadagnalli si suda.',                                 cat:'proverbe' },
  { id:'pr92',  fr:'Qui dépense davantage, dépense moins.',                                             pum:'Chì più spende, menu spende.',                                                           cat:'proverbe' },
  { id:'pr93',  fr:'Ne mange pas le brocciu « en herbe » (ne dilapide pas ce que tu n\'as pas encore).', pum:'Ùn ti manghjà u brocciu in erba.',                                                   cat:'proverbe' },
  { id:'pr94',  fr:'Qui se détache des siens souvent soupire.',                                         pum:'Chì si stacca da i soi, spessu suspira.',                                                cat:'proverbe' },
  { id:'pr95',  fr:'Qui plus désire plus s\'essouffle.',                                                pum:'Chì più brama più s\'affanna.',                                                          cat:'proverbe' },
  { id:'pr96',  fr:'On ne désire que ce qu\'on ne connaît pas.',                                        pum:'Ùn si brama chè ciò ch\'ùn si cunnosce.',                                               cat:'proverbe' },
  { id:'pr97',  fr:'Qui plus a, plus voudrait.',                                                        pum:'Chì più hà più vurrebbe.',                                                               cat:'proverbe' },
  { id:'pr98',  fr:'Ne souhaite pas aux autres ce que tu ne voudrais pas pour toi.',                    pum:'Ùn bramà à l\'altri ciò ch\'è tù ùn vurristi per tè.',                                  cat:'proverbe' },
  { id:'pr99',  fr:'La vie est faite comme un escalier : les uns montent, les autres descendent.',      pum:'A vita hè fatta à scala : à chì codda, à chì fala.',                                     cat:'proverbe' },
  { id:'pr100', fr:'Ce qui est écrit dans le ciel arrive sur la terre.',                                pum:'Ciò chì hè scrittu in celu in terra accade.',                                            cat:'proverbe' },
  { id:'pr101', fr:'Chacun naît avec son destin.',                                                      pum:'Ognunu nasce cù lu so destinu.',                                                         cat:'proverbe' },
  { id:'pr102', fr:'Personne ne peut dire : « j\'y serai demain ».',                                    pum:'Nimu pò dì : ci saraghju dumane.',                                                     cat:'proverbe' },
  { id:'pr103', fr:'À cheval donné on ne regarde pas les dents.',                                       pum:'À cavallu datu ùn li guardà palataghja.',                                               cat:'proverbe' },
  { id:'pr104', fr:'Qui paie ses dettes fait un capital.',                                              pum:'Chì paga debbiti face capitale.',                                                        cat:'proverbe' },
  { id:'pr105', fr:'Ne renvoie pas à demain ce que tu peux faire aujourd\'hui.',                        pum:'Ùn attempà à dumane ciò ch\'è tù pò fà oghje.',                                       cat:'proverbe' },
  { id:'pr106', fr:'Dans une bouche fermée n\'entrent pas les mouches', pum:'In bocca chjuda ùn ci entri moschi',                    cat:'proverbe' },
  { id:'pr107', fr:'Qui sait parler parle peu, qui ne sait pas se taise.',                              pum:'Chì sà parlà parli pocu, ch\'ùn sà stia zittu.',                                        cat:'proverbe' },
  { id:'pr108', fr:'Ses effets sales, on ne les donne pas à laver.',                                    pum:'I so panni brutti ùn si danu à lavà.',                                                   cat:'proverbe' },
  { id:'pr109', fr:'Il vaut mieux donner et s\'en repentir que garder et s\'en repentir.',              pum:'Hè megliu à dà è pente chè tene è pente.',                                              cat:'proverbe' },
  { id:'pr110', fr:'Avec le vinaigre on ne prend pas de mouches.',                                      pum:'Cù l\'acetu ùn si pidda mosche.',                                                       cat:'proverbe' },
  { id:'pr111', fr:'Une épée de miel fait plus qu\'une épée d\'acier.',                                 pum:'Una spada di mele face più chè una spada d\'aciaru.',                                    cat:'proverbe' },
  { id:'pr112', fr:'Qui se mesure dure.',                                                               pum:'Chì si misura, dura.',                                                                   cat:'proverbe' },
  { id:'pr113', fr:'Il vaut mieux être la fourmi que la cigale.',                                       pum:'Hè meddu à esse a furmicula chè a cicala.',                                             cat:'proverbe' },
  { id:'pr114', fr:'L\'arbre tordu, redresse-le quand il est jeune.',                                   pum:'L\'alberu tortu, addirizzatelu quandu ellu s\'hè giovanu.',                              cat:'proverbe' },
  { id:'pr115', fr:'Qui n\'espère pas se désespère.',                                                   pum:'Chì ùn spera s\'addispera.',                                                             cat:'proverbe' },
  { id:'pr116', fr:'L\'espérance, la première qui naît, la dernière qui meurt.',                        pum:'A speranza, prima chì nasce, ultima chì more.',                                          cat:'proverbe' },
  { id:'pr117', fr:'L\'espérance est la dernière chose à perdre.',                                      pum:'A speranza hè l\'ultima cosa à perde.',                                                  cat:'proverbe' },
  { id:'pr118', fr:'L\'espérance est le pain des pauvres.',                                             pum:'A speranza hè u pane di i poveri.',                                                      cat:'proverbe' },
  { id:'pr119', fr:'Plus on vit, plus on en voit.',                                                     pum:'Più si campa più si ne vede.',                                                           cat:'proverbe' },
  { id:'pr120', fr:'On ne peut être au four et au moulin.',                                             pum:'Ùn si pò esse à u fornu è à u mulinu.',                                                  cat:'proverbe' },
  { id:'pr121', fr:'On ne peut pas chanter et porter la croix.',                                        pum:'Ùn si pò cantà è purtà a croce.',                                                       cat:'proverbe' },
  { id:'pr122', fr:'Il vaut mieux faire peu et bien que beaucoup et mal.',                              pum:'Hè medduu u fà pocu è bè chè assai è male.',                                            cat:'proverbe' },
  { id:'pr123', fr:'Si tu ne peux faire comme tu veux, fais comme tu peux.',                            pum:'S\'è t\'ùn po fà cum\'è tù voli, fà cum\'è tù po.',                                   cat:'proverbe' },
  { id:'pr124', fr:'Ce n\'est pas au dire mais au faire que l\'on voit l\'homme.',                      pum:'Ùn hè micca à u dì, ma à u fà chì l\'omu si vede.',                                     cat:'proverbe' },
  { id:'pr125', fr:'Les malheurs de la marmite, ne les connaît que la cuillère.',                       pum:'I guai di a pignatta ùn li cunnosce chè a cuchjara.',                                    cat:'proverbe' },
  { id:'pr126', fr:'Dans chaque famille il y a une croix, et dans chaque lit il y a des puces.',        pum:'In ogni famiglia ci hè croce è in ogni lettu ci hè puce.',                              cat:'proverbe' },
  { id:'pr127', fr:'Il vaut mieux des gens que des biens.',                                             pum:'Hè meddu ghjente chè robba.',                                                           cat:'proverbe' },
  { id:'pr128', fr:'Tire plus un poil de femme que cent paires de bœufs.',                              pum:'Tira più un pel di donna chè centu paghji di boi.',                                      cat:'proverbe' },
  { id:'pr129', fr:'La femme de l\'autre est toujours la plus belle.',                                  pum:'A moglia di l\'altri hè sempre a più bedda.',                                             cat:'proverbe' },
  { id:'pr130', fr:'De femmes et de vin n\'en fais pas des réserves.',                                  pum:'Di donna è di vinu ùn ni fà magazinu.',                                                  cat:'proverbe' },
  { id:'pr131', fr:'C\'est la femme qui ne parle pas qui vole les cœurs.',                              pum:'Hè a donna chì ùn parla chì s\'arruba i cori.',                                         cat:'proverbe' },
  { id:'pr132', fr:'Il n\'y a pas de samedi sans soleil, ni de pré sans fleurs, ni de femme sans amour.', pum:'Ùn ci hè sabbatu senza sole, ùn ci hè pratu senza fiore, ùn ci hè donna senza amore.', cat:'proverbe' },
  { id:'pr133', fr:'Une bonne épouse est un paradis en ce monde ; une mauvaise, un enfer.',             pum:'Una bona moglia hè un paradisu in stu mondu ; una gattiva un infernu.',                  cat:'proverbe' },
  { id:'pr134', fr:'La femme en sait un point de plus que le diable.',                                  pum:'A donna ne sà un puntu di più chè u diavule.',                                           cat:'proverbe' },
  { id:'pr135', fr:'La femme ne veut jamais avoir tort.',                                               pum:'A donna ùn vole mai avè tortu.',                                                         cat:'proverbe' },
  { id:'pr136', fr:'Il vaut mieux une femme intelligente qu\'un gros patrimoine.',                      pum:'Vale più una donna astuta chè un grossu casale.',                                        cat:'proverbe' },
  { id:'pr137', fr:'Ce n\'est pas toujours fête quand sonnent les cloches.',                            pum:'Ùn hè micca sempre festa quandu sonanu e campane.',                                      cat:'proverbe' },
  { id:'pr138', fr:'Il n\'y a pas de fleurs sans épines.',                                              pum:'Ùn ci hè fiori senza spine.',                                                            cat:'proverbe' },
  { id:'pr139', fr:'Avec la force, on abat même les montagnes.',                                        pum:'Cù a forza s\'abbattenu ancu e muntagne.',                                               cat:'proverbe' },
  { id:'pr140', fr:'La chance ne vient jamais deux fois.',                                              pum:'A furtuna ùn vene mai duie volte.',                                                      cat:'proverbe' },
  { id:'pr141', fr:'Il vaut mieux être fou que de se voir reprocher une faute.',                        pum:'Hè megliu ad esse mattu chè rimpruveratu.',                                              cat:'proverbe' },
  { id:'pr142', fr:'À table et au lit, il ne faut pas de sujets de discorde.',                         pum:'À tola è à lettu ùn ci vole sughjettu.',                                               cat:'proverbe' },
  { id:'pr143', fr:'Dis toujours la vérité, mais tais celle qui trouble la paix.',                      pum:'Dì sempre a verità ma pensa chè tù devi tace quella chì disturba a pace.',               cat:'proverbe' },
  { id:'pr144', fr:'Un beau oui et un beau non valent plus que cent mais.',                  pum:'Un beddu sì è un beddu nò, valenu più chè centu ma.',                       cat:'proverbe' },
  { id:'pr145', fr:'Qui va avec le boiteux apprend à boiter.',                                          pum:'À chì và cù u zoppu impara à zuppicà.',                                                  cat:'proverbe' },
  { id:'pr146', fr:'Le fromage qui pue, plus on le cache et plus il sent.',                             pum:'U casgiu puzzinosu più s\'appiatta è più senti.',                                    cat:'proverbe' },
  { id:'pr147', fr:'Il n\'y a pas de fumée sans feu.',                                                  pum:'Ùn ci hè focu senza fume.',                                                              cat:'proverbe' },
  { id:'pr148', fr:'Le pain le plus savoureux, c\'est celui qu\'on a gagné.',                           pum:'U pane u più inzuccheratu hè quellu chì s\'hè stentatu.',                               cat:'proverbe' },
  { id:'pr149', fr:'Qui mange ses figues vertes n\'en trouve plus de mûres.',                           pum:'Chì manghja i so fichi acerbi ùn ne trova più di maturi.',                              cat:'proverbe' },
  { id:'pr150', fr:'Il vaut mieux partager avec les autres que désirer tout seul.',                     pum:'Hè megliu cù l\'altri sparte chè solu bramà.',                                           cat:'proverbe' },
  { id:'pr151', fr:'L\'habit ne fait pas le moine.',                                                    pum:'Ùn hè l\'abitu chì face u monacu.',                                                      cat:'proverbe' },
  { id:'pr152', fr:'Qui naît mulet ne devient pas cheval.',                                             pum:'A chì nasce mulu ùn diventa cavaddu.',                                                     cat:'proverbe' },
  { id:'pr153', fr:'Des corbeaux ne peuvent sortir des rossignols.',                                    pum:'Da i corbi ùn pò escia russignoli.',                                                     cat:'proverbe' },
  { id:'pr154', fr:'L\'hiver, il vaut mieux un bon feu qu\'une bonne table.',                           pum:'L\'inguernu, hè meddu un bon focu chè un bon manghjà.',                                 cat:'proverbe' },
  { id:'pr155', fr:'L\'homme averti est à moitié sauvé.',                                               pum:'L\'omu avertitu hè mezu salvu.',                                                         cat:'proverbe' },
  { id:'pr156', fr:'Entre la femme et le mari, n\'y mets pas le doigt.',                                pum:'Trà a moglie è u maritu ùn ci mette u ditu.',                                            cat:'proverbe' },
  { id:'pr157', fr:'Il vaut mieux mourir que vivre dans la honte.',                                     pum:'Hè meddu à more chè à vive incù a vergogna.',                                          cat:'proverbe' },
  { id:'pr158', fr:'Qui se fait de miel, les mouches le mangent.',                                      pum:'Chì si face di mele e mosche u si manghjanu.',                                           cat:'proverbe' },
  { id:'pr159', fr:'Mérite toujours et ne prétends jamais.',                                            pum:'Merita sempre è ùn pretende mai.',                                                       cat:'proverbe' },
  { id:'pr160', fr:'Heureux qui se connaît lui-même.',                                                  pum:'Beatu chì si sà cunnosce.',                                                              cat:'proverbe' },

  // ── Pruverbii – Parte 3 ──────────────────────────────────────────────────
  { id:'pr161', fr:'Personne ne naît tout enseigné.',                                                   pum:'Amparatu ùn nasce nimu.',                                                                cat:'proverbe' },
  { id:'pr162', fr:'L\'argent et le mal au ventre, qui l\'a se le garde.',                              pum:'I soldi è a pena in corpu à chì l\'hà li si teni.',                                      cat:'proverbe' },
  { id:'pr163', fr:'La fortune est plus difficile à faire qu\'à perdre.',                               pum:'A furtuna hè più difficile à falla chè à perdela.',                                      cat:'proverbe' },
  { id:'pr164', fr:'Qui prend de l\'argent vend sa liberté.',                                           pum:'Chì pidda soldi, vende a so libertà.',                                                  cat:'proverbe' },
  { id:'pr165', fr:'Il ne suffit pas d\'arriver, encore faut-il arriver à temps.',                      pum:'Ùn basta à ghjunghje, bisogna ancu à arrivà à tempu.',                                   cat:'proverbe' },
  { id:'pr166', fr:'L\'arrogance ne fait pas changer le temps.',                                        pum:'A superbia ùn face cambià u tempu.',                                                     cat:'proverbe' },
  { id:'pr167', fr:'Il vaut mieux avoir un oiseau dans la main que cent en vol.',                       pum:'Hè meddu à avè un aceddu in manu chè centu vulendu.',                                   cat:'proverbe' },
  { id:'pr168', fr:'Il vaut mieux l\'œuf dans la main que la poule plus tard.',                         pum:'Hè megliu l\'ovu in manu chè a gallina à u tempu.',                                      cat:'proverbe' },
  { id:'pr169', fr:'L\'avenir est hors de nous, mais notre volonté est en nous.',                       pum:'L\'avvene hè for di noi, ma a nostra vuluntà hè in noi.',                                cat:'proverbe' },
  { id:'pr170', fr:'La poule qui chante est celle qui a fait un œuf.',                                  pum:'Gallina chì canta hà fattu l\'ovu.',                                                      cat:'proverbe' },
  { id:'pr171', fr:'Une cuillère charrie plus qu\'un bateau.',                                          pum:'Carrieghja più una cuchjara chè una nave.',                                               cat:'proverbe' },
  { id:'pr172', fr:'Qui parle beaucoup résout peu.',                                                    pum:'À chì parla assai risolve pocu.',                                                         cat:'proverbe' },
  { id:'pr173', fr:'Qui parle trop est peu écouté.',                                                    pum:'À chì troppu parla hè pocu ascultatu.',                                                   cat:'proverbe' },
  { id:'pr174', fr:'Il faut souffrir pour paraître belle.',                                             pum:'Bisogna à suffrì per bella apparì.',                                                      cat:'proverbe' },
  { id:'pr175', fr:'Qui naît belle naît mariée.',                                                       pum:'À chì nasci bella, nasci maritata.',                                                      cat:'proverbe' },
  { id:'pr176', fr:'Entre belle-mère et belle fille il y a souvent du malheur.',                               pum:'Trà socera è nora ci hè spessu malora.',                                                  cat:'proverbe' },
  { id:'pr177', fr:'Le moindre peu est beaucoup pour qui a besoin.',                                    pum:'Ogni pocu hè assai per chì hà bisognu.',                                                  cat:'proverbe' },
  { id:'pr178', fr:'C\'est quand le besoin est là qu\'on reconnaît les siens.',                         pum:'Quandu ci hè u bisognu si cunnoscenu i soi.',                                        cat:'proverbe' },
  { id:'pr179', fr:'Le bien ne fait pas de bruit.',                                                     pum:'U bè ùn face rimore.',                                                                    cat:'proverbe' },
  { id:'pr180', fr:'Il n\'est jamais trop tard pour faire le bien.',                                    pum:'Ùn hè mai troppu tardi per fà bè.',                                                      cat:'proverbe' },
  { id:'pr181', fr:'Les biens, on sait qui les a gagnés, on ne sait pas qui en profitera.',             pum:'A robba, si sà chì la stanta, ùn si sà chì la gode.',                                    cat:'proverbe' },
  { id:'pr182', fr:'Qui n\'a pas de bon sens étant enfant n\'en a pas grand.',                          pum:'Chì ùn ne hà da zitellu ùn ne hà da grande.',                                            cat:'proverbe' },
  { id:'pr183', fr:'Le courage sans bon sens est dangereux.',                                           pum:'U curaghju senza ghjudiziu hè piriculosu.',                                               cat:'proverbe' },
  { id:'pr184', fr:'Le bon sens sert plus aux ignorants que le savoir aux instruits.',                  pum:'U ghjudiziu serve più à l\'ignuranti chè a sapienza à i dotti.',                         cat:'proverbe' },
  { id:'pr185', fr:'Chien qui aboie ne prend rien à la chasse.',                                       pum:'Ghjacaru chì abbaghja ùn pidda à caccia.',                                                   cat:'proverbe' },
  { id:'pr186', fr:'Chien qui aboie beaucoup mord peu.',                                               pum:'Ghjacaru chì abbaghja assai pocu morde.',                                                     cat:'proverbe' },
  { id:'pr187', fr:'L\'amour ne s\'arrête pas à la valeur d\'un cadeau.',                               pum:'L\'amore ùn stà micca in lu valore di un regalu.',                                       cat:'proverbe' },
  { id:'pr188', fr:'Le biscuit va à ceux qui ont les dents.',                                          pum:'U biscottu vene à chì hà i denti.',                                                      cat:'proverbe' },
  { id:'pr189', fr:'Quand il n\'y a pas de chat à la maison, les souris y dansent.',                   pum:'Quandu ùn ci hè gattu in casa, balaiani i topi.',                                  cat:'proverbe' },
  { id:'pr190', fr:'Qui cherche trouve.',                                                               pum:'À chì cerca trova.',                                                                      cat:'proverbe' },
  { id:'pr191', fr:'Le coup de pied du cheval placide est le plus mauvais.',                           pum:'U calciu di u cavallu mansu hè u più gattivu.',                                           cat:'proverbe' },
  { id:'pr192', fr:'Quand on ne peut battre le cheval, on bat la selle.',                              pum:'Quandu ùn si pò batte u cavallu si batte a sella.',                                       cat:'proverbe' },
  { id:'pr193', fr:'L\'occasion n\'a qu\'un cheveu.',                                                   pum:'L\'occasione ùn hà chè un capellu.',                                                     cat:'proverbe' },
  { id:'pr194', fr:'Si tu veux aller en paix, n\'agace pas le chien couché.',                          pum:'Sì tù voli andà in pace ùn stuzzicà u cane chì ghjace.',                                 cat:'proverbe' },
  { id:'pr195', fr:'Qui sème le vent récolte la tempête.',                                              pum:'Chì sumena u ventu ne racoglie a timpesta.',                                              cat:'proverbe' },
  { id:'pr196', fr:'Plus on monte haut, plus on risque de tomber bas.',                                pum:'Più si colla in sù è più si risica di casca in ghjò.',                                   cat:'proverbe' },
  { id:'pr197', fr:'Le cœur est un moteur et fait souvent dérailler l\'honneur.',                      pum:'U core hè mutore è face spessu diraglià l\'onore.',                                      cat:'proverbe' },
  { id:'pr198', fr:'Il n\'y a pas de cœur sans peine.',                                                pum:'Ùn ci hè core senza pena.',                                                              cat:'proverbe' },
  { id:'pr199', fr:'La colère ne fait pas changer le temps.',                                          pum:'A zerga ùn face scambià u tempu.',                                                      cat:'proverbe' },
  { id:'pr200', fr:'Qui a raison et se met en colère perd sa cause.',                                  pum:'Chì hà ragione è si mette in collera perde a so causa.',                                 cat:'proverbe' },
  { id:'pr201', fr:'Qui ne sait pas faire ne sait pas non plus commander.',                            pum:'Chì ùn sà fà ùn sà mancu cumandà.',                                                     cat:'proverbe' },
  { id:'pr202', fr:'Qui ne sait pas commander sache obéir.',                                           pum:'Chì nun sà cumandà sappia ubbidì.',                                                      cat:'proverbe' },
  { id:'pr203', fr:'Il vaut mieux être seul que mal accompagné.',                                      pum:'Hè meddu à essa solu chè mal\'accumpagnatu.',                                           cat:'proverbe' },
  { id:'pr204', fr:'Qui va au moulin s\'enfarine.',                                                     pum:'Chì và à u mulinu, s\'infarina.',                                                        cat:'proverbe' },
  { id:'pr205', fr:'Corbeaux et corbeaux ne s\'arrachent pas les yeux.',                               pum:'Corbi cun corbi ùn si caccianu l\'ochji.',                                               cat:'proverbe' },
  { id:'pr206', fr:'La nuit est la mère du conseil.',                                                  pum:'A notte hè madre di cunsigliu.',                                                         cat:'proverbe' },
  { id:'pr207', fr:'On est plus capable de donner de bons conseils aux autres que de les suivre soi-même.', pum:'Si hè più capaci di dà boni cunsigli à l\'altri chè di seguilli sè stessu.',    cat:'proverbe' },
  { id:'pr208', fr:'Qui ne répond consent.',                                                           pum:'Chì ùn risponde accunsente.',                                                            cat:'proverbe' },
  { id:'pr209', fr:'Si tu craches contre le vent, ça te revient sur le visage.',                       pum:'S\'è tù stupi contru à u ventu ti volta in faccia.',                                     cat:'proverbe' },
  { id:'pr210', fr:'Pas de règle sans exception.',                                                     pum:'Ùn ci hè regula senza eccezzione.',                                                      cat:'proverbe' },
  { id:'pr211', fr:'Le plus riche est celui qui se contente du sien.',                                 pum:'U più riccu hè quellu chì si cuntenta di u soiu.',                                       cat:'proverbe' },
  { id:'pr212', fr:'Il vaut mieux jouir de peu que peiner beaucoup.',                                  pum:'Hè megliu à gode pocu chè à tribbulà assai.',                                           cat:'proverbe' },
  { id:'pr213', fr:'Qui est content au coin de son feu est content partout.',                          pum:'À chì hè cuntentu à u so focu hè cuntentu in ogni locu.',                               cat:'proverbe' },
  { id:'pr214', fr:'Même si le lit est mal fait, on y dort bien si l\'homme est las.',                 pum:'Ancu sì u lettu hè mal fattu ci si dorme bè sì l\'omu hè stancu.',                      cat:'proverbe' },
  { id:'pr215', fr:'Qui s\'arrête au milieu de ceux qui avancent reçoit des coups sur les talons.',   pum:'À chì si ferma à mezu à quelli chì caminanu leve e scalcagnate.',                       cat:'proverbe' },
  { id:'pr216', fr:'Quand un Corse n\'a rien à faire, il défait le mur et le remonte plus loin.',     pum:'Quandu un Corsu ùn hà nunda da fà, disfà u muru è u porta più indà.',                   cat:'proverbe' },
  { id:'pr217', fr:'Aie du bien, ô Corse, parce que du mal il ne t\'en manque pas.',                  pum:'Aghja u bè, o Corsu, chì u male ùn ti manca.',                                          cat:'proverbe' },
  { id:'pr218', fr:'Le courage ne se vend pas à l\'auberge.',                                         pum:'U curagiu ùn si vende à l\'ustaria.',                                                    cat:'proverbe' },
  { id:'pr219', fr:'Qui a du courage ne craint pas la mort.',                                         pum:'À chì hà curagiu ùn teme a morte.',                                                     cat:'proverbe' },
  { id:'pr220', fr:'Il vaut mieux tenir que courir.',                                                  pum:'Hè megliu d\'avè à tene chè avè à corre.',                                              cat:'proverbe' },
  { id:'pr221', fr:'On ne peut pas être tous instruits, mais courtois oui.',                           pum:'Tutti dotti ùn si pò esse, ma galantomi.',                                               cat:'proverbe' },
  { id:'pr222', fr:'Qui ne fait pas le mal ne craint pas le mal.',                                     pum:'Chì male ùn face, male ùn teme.',                                                       cat:'proverbe' },
  { id:'pr223', fr:'À celui qui crie le plus, la vache est sienne.',                                  pum:'À chì più mughja, a vacca hè a soia.',                                                    cat:'proverbe' },
  { id:'pr224', fr:'Le repu ne croit pas l\'affamé.',                                                  pum:'U techju ùn crede u famitu.',                                                            cat:'proverbe' },
  { id:'pr225', fr:'De ce que tu vois crois-en la moitié ; de ce que tu entends ne crois rien.',      pum:'Di ciò ch\'è tù vedi, credine a metà ; di ciò ch\'è tù senti, un crede nulla.',         cat:'proverbe' },
  { id:'pr226', fr:'Qui commande fait la loi.',                                                        pum:'Chì cumanda face lege.',                                                                 cat:'proverbe' },
  { id:'pr227', fr:'Dans l\'amour, on ne commande pas.',                                               pum:'À l\'amore ùn si cumanda.',                                                             cat:'proverbe' },
  { id:'pr228', fr:'Malheureux qui en est à emprunter le bon sens des autres.',                       pum:'Malasciu à chì stà à ghjudiziu in prestu.',                                             cat:'proverbe' },
  { id:'pr229', fr:'Le bruit ne fait pas de bien.',                                                    pum:'U rimore ùn face bè.',                                                                   cat:'proverbe' },
  { id:'pr230', fr:'Qui vit dans le bien doit vivre aussi dans le malheur.',                           pum:'À chì stà à u bè deve stà ancu à u male.',                                              cat:'proverbe' },
  { id:'pr231', fr:'Qui prend conseil des autres ne pèche pas tout seul.',                             pum:'Chì cù l\'altri si cunsiglia solu ùn pecca.',                                           cat:'proverbe' },
  { id:'pr232', fr:'Qui mange sans boire a soif après.',                                               pum:'Chì manghja senza beie hà a sete dopu.',                                                cat:'proverbe' },
  { id:'pr233', fr:'Il n\'y a pas de mariage sans commérages.',                                        pum:'Ùn ci hè maritaghju senza batalaghju.',                                                  cat:'proverbe' },
  { id:'pr234', fr:'Plus vite on monte, plus on tombe à toute vitesse.',                               pum:'Più prestu si colla, più in furia si fala.',                                             cat:'proverbe' },
  { id:'pr235', fr:'Qui construit de mauvaises fondations finit encore plus mal le faîte.',            pum:'Chì male fonda, male accima.',                                                           cat:'proverbe' },
  { id:'pr236', fr:'La luzerne n\'est pas faite pour les ânes.',                                       pum:'A luserna nun hè fatta per i sumeri.',                                                   cat:'proverbe' },
  { id:'pr237', fr:'Des femmes et des bœufs, tires-en autant que tu peux.',                            pum:'Di e donne è di i boi cacciane quant\'è tù poi.',                                       cat:'proverbe' },
  { id:'pr238', fr:'Qui fait à sa tête paie de sa poche.',                                             pum:'Chì face di testa paca di stacca.',                                                     cat:'proverbe' },
  { id:'pr239', fr:'Qui voit et touche n\'en croit que la moitié.',                                    pum:'Vede è tuccà ùn crede chè a metà.',                                                     cat:'proverbe' },
  { id:'pr240', fr:'On peut dire cuisinière celle qui sait faire un banquet pour dix étrangers.',     pum:'Si pò dì cucinara quella chì sà fà un pranzu à dece furesteri.',                        cat:'proverbe' },

  // ── Pruverbii – Parte 4 ──────────────────────────────────────────────────
  { id:'pr241', fr:'C\'est avec de l\'appât qu\'on prend le poisson.',                                 pum:'Cù u buccone si piglia pesce.',                                                          cat:'proverbe' },
  { id:'pr242', fr:'Qui ne gâche pas un peu la matière première n\'apprend pas non plus.',             pum:'À chì ùn guasta mancu impara.',                                                          cat:'proverbe' },
  { id:'pr243', fr:'Qui ne se baisse pas pour un sou ne vaut pas un liard.',                           pum:'Chì ùn si cala per un soldu ùn vale una baiocca.',                                       cat:'proverbe' },
  { id:'pr244', fr:'Qui a de l\'argent peut tout faire.',                                              pum:'À chì hà soldi face tuttu.',                                                             cat:'proverbe' },
  { id:'pr245', fr:'La majorité des gens a plus de temps que d\'argent.',                              pum:'A maiò parte anu più tempu chè soldi.',                                                   cat:'proverbe' },
  { id:'pr246', fr:'De l\'argent et de la bonne foi, il y en a moins qu\'on ne croit.',                pum:'Dinari è bona fede ci ne hè menu ch\'omu crede.',                                        cat:'proverbe' },
  { id:'pr247', fr:'À force d\'arranger ce qui va bien, on le gâte.',                                  pum:'À forza d\'accuncià ciò chì stà bè si guasta.',                                          cat:'proverbe' },
  { id:'pr248', fr:'Dis-moi combien tu m\'aimes, et non pas ton lien de parenté avec moi.',            pum:'Dimmi quant\'i tù mi teni è micca quant\'i tù mi veni.',                                 cat:'proverbe' },
  { id:'pr249', fr:'Il vaut mieux vingt ans à l\'auberge que vingt ans à la caserne.',                 pum:'Hè megliu vinti anni à l\'albergu chè in caserna.',                                      cat:'proverbe' },
  { id:'pr250', fr:'Qui compte sur les autres risque de se trouver couillon.',                         pum:'Chì conta sopra à l\'altri à l\'occasione risica di truvassi cuglione.',                  cat:'proverbe' },
  { id:'pr251', fr:'N\'attends rien des autres.',                                                      pum:'Ùn aspettà nudda da l\'altri.',                                                           cat:'proverbe' },
  { id:'pr252', fr:'Avril a trente jours, mais s\'il en avait trente-et-un, ça ne ferait de mal à personne.', pum:'Aprile hè di trenta ma s\'ellu fussi di trent\'unu, ùn farebbe mal à nisunu.',  cat:'proverbe' },
  { id:'pr253', fr:'Ce qui ne démarre pas en mars est mort en avril.',                                 pum:'Ciò chì di marzu ùn move, d\'aprile hè mortu.',                                          cat:'proverbe' },
  { id:'pr254', fr:'Janvier froid, février verdoie, mars sec, avril mouillé — heureux qui a semé.',   pum:'Ghjennaghju cutrura, ferraghju parura, marzu asciuttu, aprile bagnatu, beatu à chì hà suminatu.', cat:'proverbe' },
  { id:'pr255', fr:'On appelle souvent « père » celui qui ne l\'est pas.',                             pum:'Si chjama spessu « babbu » quellu ch\'ùn hè.',                                           cat:'proverbe' },
  { id:'pr256', fr:'Les coups de bâton ne plaisent même pas aux chiens.',                             pum:'E bastunate ùn piacenu mancu à i cani.',                                                 cat:'proverbe' },
  { id:'pr257', fr:'Au chien qui aboie, on donne ou du pain ou du bâton.',                            pum:'À cane chì abbaghja, o pane o bastone.',                                                 cat:'proverbe' },
  { id:'pr258', fr:'Qui n\'est pas beau de nature, il ne sert à rien de le laver.',                   pum:'À chì ùn hè beddu di natura ùn vale lavatura.',                                          cat:'proverbe' },
  { id:'pr259', fr:'La beauté est une dot, mais combien périlleuse.',                                  pum:'A bellezza hè una dota ma hè assai periculosa.',                                         cat:'proverbe' },
  { id:'pr260', fr:'Ne fais pas le bien, tu n\'auras pas non plus de mal.',                            pum:'Ùn fà micca bè, ùn avarè micca male.',                                                   cat:'proverbe' },
  { id:'pr261', fr:'Les uns font les fortunes, les autres les mangent.',                               pum:'À chì face furtuna, à chì a manghja.',                                                   cat:'proverbe' },
  { id:'pr262', fr:'Qui a du bien-être est riche et ne le sait pas.',                                  pum:'Chì hà u benistà, hè riccu è ùn la sà.',                                                 cat:'proverbe' },
  { id:'pr263', fr:'De ce qui est bon, chacun en veut sa part.',                                       pum:'Di ciò chì hè bonu ognunu ne vole u so pezzu.',                                          cat:'proverbe' },
  { id:'pr264', fr:'Le bon est toujours meilleur que le beau.',                                        pum:'U bonu hè sempre megliu chè u bellu.',                                                   cat:'proverbe' },
  { id:'pr265', fr:'Qui n\'a pas de bon sens, il lui entre par les talons.',                           pum:'À chì ùn hà ghjudiziu li entri per i calcagni.',                                         cat:'proverbe' },
  { id:'pr266', fr:'Sait souvent deviner celui qui sait bien juger.',                                  pum:'Sà spessu induvinà chì sà ben ghjudica.',                                               cat:'proverbe' },
  { id:'pr267', fr:'Le sucre ne gâte pas la boisson.',                                                 pum:'U zuccheru ùn guasta bivanda.',                                                          cat:'proverbe' },
  { id:'pr268', fr:'Qui fait le plus de mystères en sait le moins.',                                   pum:'Chì più face misteri, menu ne sà.',                                                      cat:'proverbe' },
  { id:'pr269', fr:'Qui chuchote à l\'oreille ne veut pas se faire entendre.',                         pum:'Chì parla à l\'arechje ùn vole fassi sente.',                                            cat:'proverbe' },
  { id:'pr270', fr:'Chose offerte, prends-la comme elle t\'est donnée.',                               pum:'Robba rigalata piddala cum\'edda hè data.',                                             cat:'proverbe' },
  { id:'pr271', fr:'Carnaval ne connaît pas la disette.',                                              pum:'Carnavale ùn cunnosce dicetta.',                                                         cat:'proverbe' },
  { id:'pr272', fr:'Changer de nature est une chose trop dure.',                                       pum:'Di cambià natura hè cosa troppa dura.',                                                  cat:'proverbe' },
  { id:'pr273', fr:'Fermer un œil est souvent charité ; fermer les deux c\'est toujours folie.',       pum:'Chjode un ochju hè spessu carità ; chjodeli tutt\'è dui hè sempre scimita.',             cat:'proverbe' },
  { id:'pr274', fr:'Celui qui fait le chef paie en chef.',                                             pum:'Chì capu face, capu paca.',                                                              cat:'proverbe' },
  { id:'pr275', fr:'Au cheval mort, l\'herbe fauchée ne sert à rien.',                                 pum:'À cavallu mortu ùn vale erba sigata.',                                                   cat:'proverbe' },
  { id:'pr276', fr:'L\'homme jaloux est à demi cocu.',                                                 pum:'Omu ghjelosu hè mezu curnutu.',                                                          cat:'proverbe' },
  { id:'pr277', fr:'Qui sait gouverner souvent commande.',                                             pum:'À chì sà guvernà, spessu cumanda.',                                                      cat:'proverbe' },
  { id:'pr278', fr:'Pour se gratter et pour manger, le tout est de commencer.',                        pum:'À grattà è à manghjà u tuttu hè di cumincià.',                                           cat:'proverbe' },
  { id:'pr279', fr:'L\'essentiel est de mettre en route le moulin.',                                   pum:'U tuttu hè d\'avvià u mulinu.',                                                          cat:'proverbe' },
  { id:'pr280', fr:'Qui a plus pitié des autres que de lui-même meurt dans un coin de fleuve.',        pum:'Chì hà più pietà di l\'altri chè di sè stessu mori in un cantu di fiumu.',               cat:'proverbe' },
  { id:'pr281', fr:'Le coup de pied de la jument ne tue pas le cheval.',                               pum:'Calciu di ghjumenti ùn tomba cavallu.',                                                  cat:'proverbe' },
  { id:'pr282', fr:'Qui a mauvaise conscience n\'a qu\'à se tenir coi.',                               pum:'À chì hà a camisgia brutta ùn alzi a coda.',                                             cat:'proverbe' },
  { id:'pr283', fr:'Qui n\'a pas d\'honneur n\'a pas de conscience.',                                  pum:'Chì ùn hà onore, ùn hà cuscenza.',                                                      cat:'proverbe' },
  { id:'pr284', fr:'Qui brûle du bois vert est sûr d\'avoir de la fumée.',                             pum:'À chì brusgia legne verde hè sicuru d\'avè fume.',                                       cat:'proverbe' },
  { id:'pr285', fr:'Qui dort par terre s\'écrase le dos.',                                             pum:'À chì dorme in terra si pesta u spinu.',                                                 cat:'proverbe' },
  { id:'pr286', fr:'Qui mange trop crève.',                                                            pum:'Chì manghja troppu crepa.',                                                              cat:'proverbe' },
  { id:'pr287', fr:'Quand le ciel est nuageux, il ne peut que pleuvoir.',                              pum:'Quand\'ellu hè niulatu ùn hà da fà chè piove.',                                         cat:'proverbe' },
  { id:'pr288', fr:'Quand le corps est vide, les jambes tremblent.',                                   pum:'Quand\'u corpu hè biotu, tremanu l\'anche.',                                             cat:'proverbe' },
  { id:'pr289', fr:'Quand il n\'y a plus de vin, on suce le fausset.',                                 pum:'Quandu ùn ci hè più vinu si suchja u stuppinu.',                                        cat:'proverbe' },
  { id:'pr290', fr:'Il vaut mieux un sou dont on profite que cent qu\'on peine à obtenir.',            pum:'Hè megliu un soldu à gode chè centu à pena.',                                           cat:'proverbe' },
  { id:'pr291', fr:'Qui se contente jouit.',                                                           pum:'À chì si cuntenta gode.',                                                                cat:'proverbe' },
  { id:'pr292', fr:'Il vaut mieux ainsi que pire.',                                                    pum:'Hè meddu cusì chè peghju.',                                                             cat:'proverbe' },
  { id:'pr293', fr:'Il vaut mieux se contenter du peu que d\'attendre beaucoup.',                      pum:'Hè meddu à cuntentassi di u pocu chè à aspettà l\'assai.',                             cat:'proverbe' },
  { id:'pr294', fr:'Qui manie l\'argent s\'engraisse.',                                                pum:'À chì maneghja grasseghja.',                                                             cat:'proverbe' },
  { id:'pr295', fr:'Tant que ça dure, ça fait de l\'effet.',                                           pum:'Fin chì dura fà verdura.',                                                               cat:'proverbe' },
  { id:'pr296', fr:'Qui n\'a qu\'un seul œil souvent le touche.',                                      pum:'Chì hà un ochju solu spessu si lu tocca.',                                               cat:'proverbe' },
  { id:'pr297', fr:'C\'est une œuvre de charité que de donner du travail à qui n\'en a pas.',          pum:'Hè una opera di carità à dà travagliu à chì ùn ne hà.',                                 cat:'proverbe' },
  { id:'pr298', fr:'Le sucre n\'est pas pour les cochons.',                                            pum:'U zuccheru ùn hè per i maghjali.',                                                       cat:'proverbe' },
  { id:'pr299', fr:'Ou pour dormir ou pour veiller, dans son lit on est bien.',                        pum:'O per dorme o per vighjà in lu so lettu hè un bel stà.',                                cat:'proverbe' },
  { id:'pr300', fr:'Il vaut mieux croire que chercher.',                                               pum:'Hè megliu à crede chè à circà.',                                                        cat:'proverbe' },
  { id:'pr301', fr:'Si tu veux te faire des ennemis, prête de l\'argent.', pum:'S\'è tù ti voli fà nimici, presta soldi.', cat:'proverbe' },
  { id:'pr302', fr:'Ni des prêtres ni des moines ne faites des camarades.', pum:'Nè di preti nè di frati ùn ne fate camerati.', cat:'proverbe' },
  { id:'pr303', fr:'Le prêtre ne répète jamais la messe pour les sourds.', pum:'U prete ùn ripete micca a messa per i sordi.', cat:'proverbe' },
  { id:'pr304', fr:'À la lumière d\'une torche, le torchon paraît de la toile fine.', pum:'À u lumu di a deda, u canavacciu pari tela.', cat:'proverbe' },
  { id:'pr305', fr:'Qui compte avant compte deux fois.', pum:'Chì conta inanzi conta duie volte.', cat:'proverbe' },
  { id:'pr306', fr:'Il vaut mieux y penser avant que de s\'en repentir après.', pum:'Hè megliu à pensacci nanzu chè pentesine dopu.', cat:'proverbe' },
  { id:'pr307', fr:'Le mal, il vaut mieux le prévoir que le guérir.', pum:'U male hè meddu à prevedelu chè à curallu.', cat:'proverbe' },
  { id:'pr308', fr:'Pense toujours au pire.', pum:'Pensa sempre à u peghju.', cat:'proverbe' },
  { id:'pr309', fr:'Le braiment de l\'âne ne monte pas au ciel.', pum:'Ronchi di sumeri ùn ne colla in celu.', cat:'proverbe' },
  { id:'pr310', fr:'Ni la prison ni la maladie n\'ont jamais amendé personne.', pum:'Nè prigiò nè malatia ùn anu mai amendatu à nimu.', cat:'proverbe' },
  { id:'pr311', fr:'Plus c\'est rare, plus c\'est cher.', pum:'Tantu più raru tantu più caru.', cat:'proverbe' },
  { id:'pr312', fr:'On s\'aperçoit au bouillon que c\'est du poulet.', pum:'Si vede à u brodu s\'ellu hè pullastru.', cat:'proverbe' },
  { id:'pr313', fr:'Qui veut se moquer de son compagnon fasse mieux que lui.', pum:'Chì vole burlà u cumpagnu faccia megliu chè ellu.', cat:'proverbe' },
  { id:'pr314', fr:'Tout ruisseau porte l\'eau au moulin.', pum:'Ogni vadellu porta l\'acqua à u mulinu.', cat:'proverbe' },
  { id:'pr315', fr:'Il vaut mieux profiter un peu que peiner beaucoup.', pum:'Hè meddu à gode pocu chè tribulà assai.', cat:'proverbe' },
  { id:'pr316', fr:'Le moindre peu est beaucoup pour qui a besoin.', pum:'Ogni pocu hè assai per chì hà bisognu.', cat:'proverbe' },
  { id:'pr317', fr:'Les proverbes sont issus de la bouche de l\'Esprit Saint.', pum:'I pruverbi sò esciuti da a bocca di u Spiritu Santu.', cat:'proverbe' },
  { id:'pr318', fr:'Qui naît paît.', pum:'À chì nasce pasce.', cat:'proverbe' },
  { id:'pr319', fr:'Le Seigneur envoie le froid selon les vêtements qu\'on a.', pum:'U Signore dà u freddu sicondu i panni.', cat:'proverbe' },
  { id:'pr320', fr:'D\'abord prudence, et ensuite patience.', pum:'Prima prudenza è dopu pazienza.', cat:'proverbe' },
  { id:'pr321', fr:'La prudence n\'est jamais de trop.', pum:'A prudenza ùn hè mai troppu.', cat:'proverbe' },
  { id:'pr322', fr:'Qui va nu-pieds ne sème pas d\'épines.', pum:'À chì và scalzu, ùn sumenga spine.', cat:'proverbe' },
  { id:'pr323', fr:'Quand il y a un grand amour, les défauts paraissent qualités.', pum:'Quandu ci hè un grand\' amore, i difetti parenu qualità.', cat:'proverbe' },
  { id:'pr324', fr:'Hommes, chiens et chevaux, choisis-les de race.', pum:'Omi, cani è cavalli, pigliali di razza.', cat:'proverbe' },
  { id:'pr325', fr:'Les choses étant faites, chacun veut avoir raison.', pum:'À cose fatte, ognunu vole avè ragione.', cat:'proverbe' },
  { id:'pr326', fr:'Il vaut mieux être le chef du village que le dernier de la ville.', pum:'Hè megliu à esse capu di paese chè coda di cità.', cat:'proverbe' },
  { id:'pr327', fr:'Qui diffère au lendemain diffère pour le chien.', pum:'Chì alloca per u lindumane, alloca per u cane.', cat:'proverbe' },
  { id:'pr328', fr:'Parole lâchée et pierre lancée ne peuvent plus se rattraper.', pum:'Parolla cappiata è petra tirata ùn si ponu più agguantà.', cat:'proverbe' },
  { id:'pr329', fr:'Suivant qui appelle on donne la réponse.', pum:'Secondu a chjama si dà a risposta.', cat:'proverbe' },
  { id:'pr330', fr:'Au bon chien on donne un bon os.', pum:'À u bon cane li si dà un bon ossu.', cat:'proverbe' },
  { id:'pr331', fr:'J\'appelle « Mère » qui me donne du pain.', pum:'Chjamu « Mà » à chì mi dà pane.', cat:'proverbe' },
  { id:'pr332', fr:'Si les regards étaient des éclairs, il en mourrait du monde.', pum:'Sì i sguardi eranu saetti, ne muraria ghjente.', cat:'proverbe' },
  { id:'pr333', fr:'Il n\'y a pas de règles sans exception.', pum:'Ùn ci hè regula senza eccezzione.', cat:'proverbe' },
  { id:'pr334', fr:'Chose faite ne mérite pas repentir.', pum:'Cosa fatta ùn ci vale pentimentu.', cat:'proverbe' },
  { id:'pr335', fr:'N\'est pas beau celui qui est tenu pour beau, mais est beau celui qui plaît.', pum:'Ùn hè bellu quellu chì hè bellu ma hè bellu quellu chì piace.', cat:'proverbe' },
  { id:'pr336', fr:'Au pays des aveugles, heureux qui a un œil.', pum:'In paese di i cechi, beatu à chì hà un ochju.', cat:'proverbe' },
  { id:'pr337', fr:'On ne doit pas remuer ce qui pue.', pum:'Ciò chì puzza ùn si deve bulicà.', cat:'proverbe' },
  { id:'pr338', fr:'Sur le vieux chien, le renard pisse.', pum:'À cane vechju, a volpe li piscia à dossu.', cat:'proverbe' },
  { id:'pr339', fr:'Il n\'y a que les montagnes qui ne se rencontrent pas.', pum:'Ùn sò chè e muntagne chì ùn si scontranu.', cat:'proverbe' },
  { id:'pr340', fr:'Celui qui renie sa race, l\'enfer l\'attend.', pum:'À chì rinega a so razza l\'aspetta l\'infernu.', cat:'proverbe' },
  { id:'pr341', fr:'Il vaut mieux donner et s\'en repentir que garder et s\'en repentir.', pum:'Hè megliu à dà è pente, chè tene è pente.', cat:'proverbe' },
  { id:'pr342', fr:'Le repu ne croit pas l\'affamé.', pum:'U techju ùn credi u famitu.', cat:'proverbe' },
  { id:'pr343', fr:'On baise la main qu\'on ne peut pas couper.', pum:'A mani ch\'ùn si pò taddà si basgia.', cat:'proverbe' },
  { id:'pr344', fr:'Quand on ne peut battre le cheval, on bat la selle.', pum:'Quandu ùn si pò batte u cavallu si batte a sella.', cat:'proverbe' },
  { id:'pr345', fr:'Il vaut mieux perdre la selle que le cheval.', pum:'Hè megliu à perde a sella chè u cavallu.', cat:'proverbe' },
  { id:'pr346', fr:'Hors de chez toi, respecte les usages que tu trouves.', pum:'Fora di i to lochi rispetta l\'usi ch\'è tù trovi.', cat:'proverbe' },
  { id:'pr347', fr:'Respecte et tu seras respecté.', pum:'Rispetta è sarei rispettatu.', cat:'proverbe' },
  { id:'pr348', fr:'Ce ne sont pas les plus riches qui sont les plus contents.', pum:'Ùn sò i più ricchi i più cuntenti.', cat:'proverbe' },
  { id:'pr349', fr:'Mieux vaut être pauvre et honorable que riche et honteux.', pum:'Hè megliu poveri è onorati chè ricchi è in vergogna.', cat:'proverbe' },
  { id:'pr350', fr:'La richesse rend souvent l\'homme paresseux.', pum:'A ricchezza fà spessu l\'omu corciu.', cat:'proverbe' },
  { id:'pr351', fr:'Le rire se trouve dans la bouche des fous.', pum:'A risa stà in bocca à i scemi.', cat:'proverbe' },
  { id:'pr352', fr:'Qui te veut du bien te fait pleurer, qui te veut du mal te fait rire.', pum:'Chì ti vole bè ti face pienghje, chì ti vole male ti face ride.', cat:'proverbe' },
  { id:'pr353', fr:'Qui rit trop dans sa jeunesse pleure après.', pum:'Chì ride troppu in giuventù, pienghje dopu.', cat:'proverbe' },
  { id:'pr354', fr:'Rira bien qui rira le dernier.', pum:'Ride bè, l\'ultimu chì ride.', cat:'proverbe' },
  { id:'pr355', fr:'Rome ne s\'est pas faite en un jour.', pum:'Roma ùn hè stata fatta in un ghjornu.', cat:'proverbe' },
  { id:'pr356', fr:'Des corbeaux ne peuvent sortir des rossignols.', pum:'Da i corbi ùn pò escia russignoli.', cat:'proverbe' },
  { id:'pr357', fr:'Prends la vieille route si tu ne connais pas la nouvelle.', pum:'Pidda a strada vechja sì t\'ùn cunnosci a nova.', cat:'proverbe' },
  { id:'pr358', fr:'La sagesse est la plus belle richesse.', pum:'A sapienza hè a più bella ricchezza.', cat:'proverbe' },
  { id:'pr359', fr:'Joue avec les enfants, ne plaisante pas avec les saints.', pum:'Ghjoca cù i fanti, ùn schirzà cù i Santi.', cat:'proverbe' },
  { id:'pr360', fr:'La santé et l\'amitié s\'apprécient si elles manquent.', pum:'A salute è l\'amicizia s\'apprezzanu s\'elle mancanu.', cat:'proverbe' },
  { id:'pr361', fr:'Sans paix on ne peut avoir de santé.', pum:'Senza pace ùn si pò avè salute.', cat:'proverbe' },
  { id:'pr362', fr:'La parole est d\'argent, le silence est d\'or.', pum:'A parolla hè d\'argentu, u silenziu hè d\'oru.', cat:'proverbe' },
  { id:'pr363', fr:'Ne compte que sur toi-même.', pum:'Ùn cuntà chè sopr\'à tè stessu.', cat:'proverbe' },
  { id:'pr364', fr:'Quand les yeux ne voient pas, le cœur ne souffre pas.', pum:'Ochju ùn vede, core ùn dole.', cat:'proverbe' },
  { id:'pr365', fr:'Ne souhaite pas aux autres ce que tu ne veux pas pour toi.', pum:'Ùn bramà à l\'altri ciò ch\'è t\'ùn voli per tè.', cat:'proverbe' },
  { id:'pr366', fr:'Il vaut mieux plier que rompre.', pum:'Hè megliu à piegà chè à rompe.', cat:'proverbe' },
  { id:'pr367', fr:'Le pire sourd est celui qui ne veut pas entendre.', pum:'U più gattivu sordu hè quellu ch\'ùn vole sente.', cat:'proverbe' },
  { id:'pr368', fr:'Ne laisse pas aller ce qui est sûr pour l\'incertain.', pum:'Ùn lascià corre u sicuru per l\'incertu.', cat:'proverbe' },
  { id:'pr369', fr:'Ne parle pas de corde dans la maison des pendus.', pum:'Ùn parlà di funa in casa di l\'impiccati.', cat:'proverbe' },

  { id:'pr371', fr:'Qui arrive tard, mal se loge.', pum:'Chì tardi arriva, male alloghja.', cat:'proverbe' },
  { id:'pr372', fr:'Mieux vaut tard que jamais.', pum:'Meddu tardi chè mai.', cat:'proverbe' },
  { id:'pr373', fr:'Qui sème le vent récolte la tempête.', pum:'Chì sumena u ventu ne racoglie a timpesta.', cat:'proverbe' },
