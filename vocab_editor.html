  { id:'pr378', fr:'Le temps et l\'âge sont de grands maîtres.', pum:'U tempu è l\'età sò gran maestri.', cat:'proverbe' },
  { id:'pr379', fr:'Ce qui n\'arrive pas en un an arrive en une heure.', pum:'Ciò ch\'ùn accade ind\'un annu accade ind\'una ora.', cat:'proverbe' },
  { id:'pr380', fr:'Mieux vaut tenir que courir.', pum:'Hè megliu ad avè à tene chè ad avè à corre.', cat:'proverbe' },
  { id:'pr381', fr:'Ce qui est écrit dans le ciel arrive sur la terre.', pum:'Ciò chì hè scrittu in celu in terra accade.', cat:'proverbe' },
  { id:'pr382', fr:'Le tonneau ne peut donner que le vin qu\'il contient.', pum:'A botte ùn pò dà chè u vinu ch\'ella hà.', cat:'proverbe' },

  { id:'pr384', fr:'Premier arrivé, premier logé.', pum:'Chì prima arriva, prima alloghja.', cat:'proverbe' },
  { id:'pr385', fr:'On ne peut en faire de nuit sans que ça se sache de jour.', pum:'Ùn si face di notte senza sapella di ghjornu.', cat:'proverbe' },

function loadUserWords() {
  try {
    const raw = localStorage.getItem('corsu_user_words_v1');
    return raw ? JSON.parse(raw) : [];
  } catch(e) { return []; }
}

function saveUserWords(words) {
  localStorage.setItem('corsu_user_words_v1', JSON.stringify(words));
}

function init() {
  try {
    let deletedIds = [];
    try { deletedIds = JSON.parse(localStorage.getItem('corsu_deleted_v1') || '[]'); } catch(e) {}
    const deletedSet = new Set(deletedIds);
    const pumOf = v => (v.pum !== undefined ? v.pum : v.co);              // rétro-compat
    const cisOf = v => (v.cis !== undefined ? v.cis : pumOf(v));          // cismunticu par défaut = pumunticu
    const rawEntries = VOCAB_RAW
      .filter(v => !deletedSet.has(v.id))
      .map(v => ({ id: v.id, fr: v.fr, pum: pumOf(v), cis: cisOf(v), cat: v.cat, isUser: false }));
    const userEntries = loadUserWords()
      .filter(v => !deletedSet.has(v.id))
      .map(v => ({ id: v.id, fr: v.fr, pum: pumOf(v), cis: cisOf(v), cat: v.cat || 'mot', isUser: true }));
    vocab = [...rawEntries, ...userEntries];
    vocab.forEach(v => { originals[v.id] = { fr: v.fr, pum: v.pum, cis: v.cis, cat: v.cat }; });
    verified = loadVerified();
    modified = loadModified();
    // Purge les modifs orphelines (id supprimé du VOCAB_RAW)
    Object.keys(modified).forEach(id => {
      if (!originals[id]) delete modified[id];
    });
    // Migration 'co' -> 'pum' (anciens stores) + purge des modifs redondantes (= à la source)
    Object.keys(modified).forEach(id => {
      const e = modified[id], o = originals[id];
      if (!e || !o) return;
      if (e.co !== undefined && e.pum === undefined) { e.pum = e.co; }
      delete e.co;
      Object.keys(e).forEach(f => { if (e[f] === o[f]) delete e[f]; });
      if (Object.keys(e).length === 0) delete modified[id];
    });
    saveModified();
    const userCount = userEntries.length;
    document.getElementById('header-stats').textContent =
      `${vocab.length} mots chargés${userCount > 0 ? ` (dont ${userCount} perso)` : ''}`;
    document.getElementById('loading').style.display = 'none';
    buildTable();
    applyFilters();
  } catch(e) {
    document.getElementById('loading').innerHTML = '<div class="error">❌ Erreur: ' + e.message + '</div>';
  }
}



const CATS = ['mot','expr','phr','expression','proverbe'];

function buildTable() {
  const container = document.getElementById('table-container');
  container.innerHTML = `
    <table id="vocab-table">
      <thead>
        <tr>
          <th class="td-check" title="Vérifié">✓</th>
          <th class="td-id">ID</th>
          <th class="td-fr">Français ✏️</th>
          <th class="td-co">Pumunticu ✏️<div class="th-sub2">sud</div></th>
          <th class="td-cis">Cismunticu ✏️<div class="th-sub2">nord</div></th>
          <th class="td-cat">Catégorie ✏️</th>
          <th class="td-actions"></th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>`;
}

function getCurrent(v, field) {
  return modified[v.id] && modified[v.id][field] !== undefined ? modified[v.id][field] : v[field];
}

function applyFilters() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  const tbody = document.getElementById('table-body');
  if (!tbody) return;

  let filtered = vocab.filter(v => {
    const curCat = getCurrent(v, 'cat');
    if (currentCat !== 'all') {
      if (currentCat === 'nb'   && !v.id.startsWith('nb')) return false;
      if (currentCat === 'pr'   && !v.id.startsWith('pr')) return false;
      if (currentCat === 'mot'  && curCat !== 'mot')  return false;
      if (currentCat === 'expr' && curCat !== 'expr' && curCat !== 'expression') return false;
      if (currentCat === 'phr'  && curCat !== 'phr')  return false;
    }
    if (showModifiedOnly && !modified[v.id]) return false;
    if (showUnverifiedOnly && verified[v.id]) return false;
    if (q) {
      const frVal  = (getCurrent(v, 'fr')||'').toLowerCase();
      const pumVal = (getCurrent(v, 'pum')||'').toLowerCase();
      const cisVal = (getCurrent(v, 'cis')||'').toLowerCase();
      if (!frVal.includes(q) && !pumVal.includes(q) && !cisVal.includes(q)) return false;
    }
    return true;
  });

  document.getElementById('count-label').textContent = `${filtered.length} mot${filtered.length > 1 ? 's' : ''} affiché${filtered.length > 1 ? 's' : ''}`;

  // Build all category options
  const allCats = [...new Set(vocab.map(v => v.cat))].sort();
  const catOptions = allCats.map(c => `<option value="${c}">${c}</option>`).join('');

  tbody.innerHTML = filtered.map(v => {
    const isModified = !!modified[v.id];
    const isVerified = !!verified[v.id];
    const frValue  = getCurrent(v, 'fr');
    const pumValue = getCurrent(v, 'pum');
    const cisValue = getCurrent(v, 'cis');
    const catValue = getCurrent(v, 'cat');
    const userBadge = v.isUser ? '<span class="user-badge">perso</span>' : '';
    const rowClass = [isModified ? 'modified' : '', isVerified ? 'verified' : '', v.isUser ? 'user-row' : ''].filter(Boolean).join(' ');
    return `<tr id="row-${v.id}" class="${rowClass}">
      <td class="td-check"><input type="checkbox" class="verify-cb" title="Marquer comme vérifié" ${isVerified ? 'checked' : ''} onchange="toggleVerified('${v.id}', this)"></td>
      <td class="td-id">${v.id}${userBadge}</td>
      <td class="td-fr">
        <span class="modified-dot"></span>
        <input class="co-edit" type="text"
          data-id="${v.id}" data-field="fr" data-user="${v.isUser ? '1' : ''}"
          value="${esc(frValue)}"
          oninput="onEdit(this)" onblur="onBlur(this)">
      </td>
      <td class="td-co">
        <input class="co-edit" type="text"
          data-id="${v.id}" data-field="pum" data-user="${v.isUser ? '1' : ''}"
          value="${esc(pumValue)}"
          oninput="onEdit(this)" onblur="onBlur(this)">
      </td>
      <td class="td-cis">
        <input class="co-edit" type="text"
          data-id="${v.id}" data-field="cis" data-user="${v.isUser ? '1' : ''}"
          value="${esc(cisValue)}"
          oninput="onEdit(this)" onblur="onBlur(this)">
      </td>
      <td class="td-cat">
        <select class="co-edit cat-select"
          data-id="${v.id}" data-field="cat" data-user="${v.isUser ? '1' : ''}"
          onchange="onEdit(this)">
          ${allCats.map(c => `<option value="${c}"${c===catValue?' selected':''}>${c}</option>`).join('')}
        </select>
      </td>
      <td class="td-actions">
        <button class="reset-btn" title="Annuler la modification" onclick="resetRow('${v.id}')">↺</button>
        <button class="delete-btn" title="Supprimer définitivement" onclick="deleteWord('${v.id}')">🗑</button>
      </td>
    </tr>`;
  }).join('');
}

function onEdit(input) {
  const id     = input.dataset.id;
  const field  = input.dataset.field;
  const isUser = input.dataset.user === '1';
  const val    = input.value;
  const orig   = originals[id][field];

  if (isUser) {
    // Save directly to localStorage for user words
    const words = loadUserWords();
    const word = words.find(w => w.id === id);
    if (word) {
      word[field] = val;
      saveUserWords(words);
      // Update originals so reset works
      originals[id][field] = val;
    }
    // Show saved indicator
    updateRow(id);
    showUserSaved(id);
    return;
  }

  if (!modified[id]) modified[id] = {};
  if (val !== orig) {
    modified[id][field] = val;
  } else {
    delete modified[id][field];
  }
  if (Object.keys(modified[id]).length === 0) delete modified[id];

  saveModified();
  updateRow(id);
  updateExportBtn();
}

function onBlur(input) {
  input.value = input.value.trim();
  onEdit(input);
}

function showUserSaved(id) {
  const row = document.getElementById('row-' + id);
  if (!row) return;
  row.classList.add('user-saved');
  setTimeout(() => row.classList.remove('user-saved'), 1200);
}

function updateRow(id) {
  const row = document.getElementById('row-' + id);
  if (!row) return;
  const v = vocab.find(x => x.id === id);
  if (v && v.isUser) return; // user rows don't need modified styling
  row.classList.toggle('modified', !!modified[id]);
}

function resetRow(id) {
  const v = vocab.find(x => x.id === id);
  if (v && v.isUser) return; // can't reset user words (already saved live)
  delete modified[id];
  saveModified();
  const orig = originals[id];
  const row = document.getElementById('row-' + id);
  if (row) {
    row.querySelector('[data-field="fr"]').value = orig.fr;
    row.querySelector('[data-field="pum"]').value = orig.pum;
    const cisIn = row.querySelector('[data-field="cis"]'); if (cisIn) cisIn.value = orig.cis;
    row.querySelector('[data-field="cat"]').value = orig.cat;
  }
  updateRow(id);
  updateExportBtn();
}

function deleteWord(id) {
  const v = vocab.find(x => x.id === id);
  if (!v) return;
  const label = `${originals[id].fr} / ${originals[id].pum}`;
  if (!confirm(`Supprimer définitivement ce mot ?\n\n"${label}"\n\nCette action est irréversible.`)) return;

  // 1. Supprimer de vocab (local)
  vocab = vocab.filter(x => x.id !== id);
  delete originals[id];
  delete modified[id];
  delete verified[id];
  saveModified();
  saveVerified();

  // 2. Ajouter à deletedIds dans localStorage (corsu_deleted_v1)
  try {
    const raw = localStorage.getItem('corsu_deleted_v1');
    const deleted = raw ? JSON.parse(raw) : [];
    if (!deleted.includes(id)) deleted.push(id);
    localStorage.setItem('corsu_deleted_v1', JSON.stringify(deleted));
  } catch(e) {}

  // 3. Si mot perso : supprimer de corsu_user_words_v1
  if (v.isUser) {
    const words = loadUserWords().filter(w => w.id !== id);
    saveUserWords(words);
  }

  // 4. Supprimer de corsu_cards_v2
  try {
    const raw = localStorage.getItem('corsu_cards_v2');
    if (raw) {
      const cards = JSON.parse(raw);
      delete cards[id];
      localStorage.setItem('corsu_cards_v2', JSON.stringify(cards));
    }
  } catch(e) {}

  // 5. Retirer la ligne du tableau
  const row = document.getElementById('row-' + id);
  if (row) row.remove();

  // 6. Mettre à jour le compteur
  updateExportBtn();
  document.getElementById('count-label').textContent =
    document.querySelectorAll('#table-body tr').length + ' mots affichés';
}

function updateExportBtn() {
  const count = Object.keys(modified).filter(id => {
    const v = vocab.find(x => x.id === id);
    return v && !v.isUser;
  }).length;
  const btn = document.getElementById('export-btn');
  btn.textContent = `📋 Exporter les modifications (${count})`;
  btn.disabled = count === 0;
}

function setFilter(el, cat) {
  currentCat = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  applyFilters();
}

function toggleModifiedOnly() {
  showModifiedOnly = !showModifiedOnly;
  document.getElementById('show-modified-btn').classList.toggle('active', showModifiedOnly);
  applyFilters();
}

function toggleVerified(id, cb) {
  if (cb.checked) {
    verified[id] = true;
  } else {
    delete verified[id];
  }
  saveVerified();
  const row = document.getElementById('row-' + id);
  if (row) row.classList.toggle('verified', !!verified[id]);
}

function toggleVerifiedOnly() {
  showUnverifiedOnly = !showUnverifiedOnly;
  document.getElementById('show-verified-btn').classList.toggle('active', showUnverifiedOnly);
  applyFilters();
}

function openExport() {
  const entries = Object.entries(modified);
  if (entries.length === 0) return;

  const lines = entries.map(([id, changes]) => {
    const v = vocab.find(x => x.id === id);
    const parts = [];
    if (changes.fr  !== undefined) parts.push(`fr: ${changes.fr}`);
    if (changes.pum !== undefined) parts.push(`pum: ${changes.pum}`);
    if (changes.cis !== undefined) parts.push(`cis: ${changes.cis}`);
    if (changes.cat !== undefined) parts.push(`cat: ${changes.cat}`);
    return `${id} | ${v ? originals[id].fr : '?'} → ${parts.join(' | ')}`;
  });

  const output = `VOCAB_CORRECTIONS:\n${lines.join('\n')}`;
  document.getElementById('export-text').value = output;
  document.getElementById('modal-overlay').classList.add('show');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('show');
}

function copyExport() {
  const text = document.getElementById('export-text').value;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('.btn-copy');
    btn.textContent = '✅ Copié !';
    setTimeout(() => btn.textContent = '📋 Copier', 2000);
  });
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function exportSnapshot() {
  const snap = {
    modified:   JSON.parse(localStorage.getItem('corsu_modified_v1')   || '{}'),
    verified:   JSON.parse(localStorage.getItem('corsu_verified_v1')   || '{}'),
    user_words: JSON.parse(localStorage.getItem('corsu_user_words_v1') || '[]'),
    deleted:    JSON.parse(localStorage.getItem('corsu_deleted_v1')    || '[]'),
  };
  const snapJSON = JSON.stringify(snap);

  // Read the current HTML source and inject a bootstrap script right after <script>
  const html = document.documentElement.outerHTML;
  const injection = `<script>
(function(){
  if (localStorage.getItem('corsu_snapshot_loaded')) return;
  var snap = ${snapJSON};
  try { localStorage.setItem('corsu_modified_v1',   JSON.stringify(snap.modified));   } catch(e){}
  try { localStorage.setItem('corsu_verified_v1',   JSON.stringify(snap.verified));   } catch(e){}
  try { localStorage.setItem('corsu_user_words_v1', JSON.stringify(snap.user_words)); } catch(e){}
  try { localStorage.setItem('corsu_deleted_v1',    JSON.stringify(snap.deleted));    } catch(e){}
  localStorage.setItem('corsu_snapshot_loaded', '1');
})();
<\/script>`;

  // Insert injection just before the first </head> or before the first <script
  let output = html.replace('</head>', injection + '\n</head>');
  if (output === html) {
    // fallback: prepend to body
    output = html.replace('<body', injection + '\n<body');
  }

  const blob = new Blob(['<!DOCTYPE html>\n' + output], { type: 'text/html' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'vocab_editor_partage.html';
  a.click();
  URL.revokeObjectURL(a.href);
}

init();
</script>
